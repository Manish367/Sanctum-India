# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New + → Blueprint → connect this repo. It reads this file and creates the service.
# You'll be prompted for the two `sync: false` secrets (MONGO_URI, CLIENT_ORIGIN).

services:
  - type: web
    name: sanctum-india-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: USE_MEMORY_MONGO
        value: "false"
      - key: MONGO_URI
        sync: false # e.g. mongodb+srv://USER:PASS@cluster0.xxxxx.mongodb.net/sanctum-india?retryWrites=true&w=majority
      - key: CLIENT_ORIGIN
        sync: false # your Vercel URL, e.g. https://sanctum-india.vercel.app
